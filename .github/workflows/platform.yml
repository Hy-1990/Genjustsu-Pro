name: Native platform contracts
on: [push, pull_request]
permissions:
  contents: read
jobs:
  platform:
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install keyring==25.7.0
      - run: python -m unittest discover -s tests -p test_platform_runtime.py -v
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tests/test_storage_migration.cjs
      - run: node tests/test_media_validation.cjs
